name: Terraform Dev Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - environments/dev/**
      - modules/**
      - .github/workflows/terraform-dev-*.yml

permissions:
  contents: read

concurrency:
  group: terraform-dev-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d # v12.3117.0 (Checkov 3.3.11)
        with:
          directory: .
          framework: terraform
          compact: true

  plan:
    name: Plan
    needs:
      - validate
      - security
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: terraform-dev-plan-${{ github.run_id }}

      - name: Initialize Terraform with remote backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          : "${TF_STATE_BUCKET:?TF_STATE_BUCKET repository variable is required}"
          terraform init -input=false \
            -backend-config=backend-ci.hcl \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Create Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=dev.tfplan

      - name: Show Terraform plan
        run: terraform show -no-color dev.tfplan
