name: Terraform Dev Destroy

#checkov:skip=CKV_GHA_7: Manual workflow_dispatch inputs are intentionally required to protect this destructive workflow from accidental execution.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type destroy-dev to confirm destruction of the dev infrastructure.
        required: true
        type: string
      reason:
        description: Optional reason for destroying the dev infrastructure.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-dev-apply
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'destroy-dev'
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: terraform-dev-destroy-${{ github.run_id }}

      - name: Initialize Terraform with remote backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          : "${TF_STATE_BUCKET:?TF_STATE_BUCKET GitHub variable is required}"
          terraform init -input=false \
            -backend-config=backend-ci.hcl \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Require non-empty managed state
        run: |
          state_list="${RUNNER_TEMP}/dev-state-list.txt"
          terraform state list > "${state_list}"

          managed_count=$(grep -Ev '(^|\.)data\.' "${state_list}" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
          if [ "${managed_count}" -eq 0 ]; then
            echo "::error::Terraform state contains no managed resources."
            exit 1
          fi

      - name: Create Terraform destroy plan
        run: terraform plan -destroy -input=false -lock-timeout=5m -out=dev-destroy.tfplan

      - name: Show Terraform destroy plan
        run: terraform show -no-color dev-destroy.tfplan

      - name: Require complete delete-only plan
        run: |
          state_list="${RUNNER_TEMP}/dev-state-list.txt"
          plan_json="${RUNNER_TEMP}/dev-destroy.tfplan.json"
          terraform show -json dev-destroy.tfplan > "${plan_json}"

          managed_count=$(grep -Ev '(^|\.)data\.' "${state_list}" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
          delete_only_count=$(jq '[.resource_changes[]? | select(.mode == "managed" and .change.actions == ["delete"])] | length' "${plan_json}")
          unsafe_change_count=$(jq '[.resource_changes[]? | select(.mode == "managed" and .change.actions != ["delete"])] | length' "${plan_json}")

          if [ "${managed_count}" -eq 0 ] || [ "${delete_only_count}" -ne "${managed_count}" ] || [ "${unsafe_change_count}" -ne 0 ]; then
            echo "::error::Destroy plan must delete every managed state resource and contain no create, update, no-op, or replacement actions."
            exit 1
          fi

      - name: Apply reviewed Terraform destroy plan
        run: terraform apply -input=false dev-destroy.tfplan

      - name: Confirm Terraform state is empty
        run: |
          if terraform state list | grep -q .; then
            echo "::error::Terraform state is not empty after the destroy apply."
            exit 1
          fi

      - name: Notify Slack
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: >-
              ${{ github.workflow }} | status: ${{ job.status }} | environment: dev |
              actor: ${{ github.actor }} | repository: ${{ github.repository }} |
              ref: ${{ github.ref_name }} | run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
