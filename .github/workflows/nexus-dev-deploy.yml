name: Nexus Dev Deploy

#checkov:skip=CKV_GHA_7: The manually supplied Nexus version is required for controlled deployments, is strictly validated, and never accepts latest.
on:
  workflow_dispatch:
    inputs:
      nexus_version:
        description: Pinned Nexus Repository semantic version to deploy
        required: true
        default: 3.83.2
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Nexus
    if: github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate Nexus version
        env:
          NEXUS_VERSION: ${{ inputs.nexus_version }}
        run: |
          if [[ ! "${NEXUS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "${NEXUS_VERSION}" == "latest" ]]; then
            echo "::error::nexus_version must be a strict semantic version and cannot be latest."
            exit 1
          fi

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: nexus-dev-deploy-${{ github.run_id }}

      - name: Initialize Terraform state access
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          : "${TF_STATE_BUCKET:?TF_STATE_BUCKET GitHub variable is required}"
          terraform init -input=false \
            -backend-config=backend-ci.hcl \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Read deployment identifiers
        id: infrastructure
        run: |
          set -Eeuo pipefail
          {
            echo "instance_id=$(terraform output -raw nexus_instance_id)"
            echo "volume_id=$(terraform output -raw nexus_data_volume_id)"
            echo "target_group_arn=$(terraform output -raw target_group_arn)"
            echo "alb_dns_name=$(terraform output -raw load_balancer_dns_name)"
            echo "rds_endpoint=$(terraform output -raw rds_endpoint)"
            echo "rds_database_name=$(terraform output -raw rds_database_name)"
            echo "rds_secret_arn=$(terraform output -raw rds_master_user_secret_arn)"
            echo "ssm_document_name=$(terraform output -raw nexus_delivery_ssm_document_name)"
          } >> "${GITHUB_OUTPUT}"

      - name: Run Nexus deployment document
        id: deployment
        env:
          INSTANCE_ID: ${{ steps.infrastructure.outputs.instance_id }}
          VOLUME_ID: ${{ steps.infrastructure.outputs.volume_id }}
          RDS_ENDPOINT: ${{ steps.infrastructure.outputs.rds_endpoint }}
          RDS_DATABASE_NAME: ${{ steps.infrastructure.outputs.rds_database_name }}
          RDS_SECRET_ARN: ${{ steps.infrastructure.outputs.rds_secret_arn }}
          SSM_DOCUMENT_NAME: ${{ steps.infrastructure.outputs.ssm_document_name }}
          NEXUS_VERSION: ${{ inputs.nexus_version }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${AWS_REGION}" =~ ^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$ ]]; then
            echo "::error::Configured AWS Region is invalid."
            exit 1
          fi
          echo "::add-mask::${RDS_SECRET_ARN}"

          parameters_file="${RUNNER_TEMP}/nexus-parameters.json"
          jq -n \
            --arg aws_region "${AWS_REGION}" \
            --arg image "sonatype/nexus3:${NEXUS_VERSION}" \
            --arg endpoint "${RDS_ENDPOINT}" \
            --arg database "${RDS_DATABASE_NAME}" \
            --arg secret_arn "${RDS_SECRET_ARN}" \
            --arg volume_id "${VOLUME_ID}" \
            '{
              AWSRegion: [$aws_region],
              NexusImage: [$image],
              RDSEndpoint: [$endpoint],
              RDSDatabaseName: [$database],
              RDSSecretARN: [$secret_arn],
              EBSVolumeID: [$volume_id],
              MountPath: ["/nexus-data"],
              NexusPort: ["8081"]
            }' > "${parameters_file}"

          command_id="$(aws ssm send-command \
            --document-name "${SSM_DOCUMENT_NAME}" \
            --instance-ids "${INSTANCE_ID}" \
            --parameters "file://${parameters_file}" \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' \
            --output text)"
          rm -f "${parameters_file}"
          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"
          echo "SSM command ID: ${command_id}"

          for _ in {1..180}; do
            command_status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "${command_status}" in
              Success)
                echo "status=Success" >> "${GITHUB_OUTPUT}"
                break
                ;;
              Cancelled|Cancelling|Failed|TimedOut)
                invocation_json="$(aws ssm get-command-invocation \
                  --command-id "${command_id}" \
                  --instance-id "${INSTANCE_ID}" \
                  --output json 2>/dev/null || true)"
                sanitized_stdout="$(jq -r '.StandardOutputContent // ""' <<<"${invocation_json}" | \
                  sed -E \
                    -e 's#arn:(aws|aws-us-gov|aws-cn):secretsmanager:[^[:space:]]+#[REDACTED_SECRET_ARN]#g' \
                    -e 's/([Uu]ser(name)?[=: ]+)[^[:space:]]+/\1[REDACTED]/g' \
                    -e 's/([Pp]assword[=: ]+)[^[:space:]]+/\1[REDACTED]/g')"
                sanitized_stderr="$(jq -r '.StandardErrorContent // ""' <<<"${invocation_json}" | \
                  sed -E \
                    -e 's#arn:(aws|aws-us-gov|aws-cn):secretsmanager:[^[:space:]]+#[REDACTED_SECRET_ARN]#g' \
                    -e 's/([Uu]ser(name)?[=: ]+)[^[:space:]]+/\1[REDACTED]/g' \
                    -e 's/([Pp]assword[=: ]+)[^[:space:]]+/\1[REDACTED]/g')"
                echo "::group::Sanitized SSM stdout"
                printf '%s\n' "${sanitized_stdout}"
                echo "::endgroup::"
                echo "::group::Sanitized SSM stderr"
                printf '%s\n' "${sanitized_stderr}"
                echo "::endgroup::"
                echo "::error::SSM deployment finished with status ${command_status}."
                exit 1
                ;;
            esac
            sleep 10
          done

          if [[ "${command_status:-}" != "Success" ]]; then
            echo "::error::SSM deployment did not complete before the timeout."
            exit 1
          fi

          sanitized_output="$(aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query StandardOutputContent \
            --output text)"
          image_id="$(grep -E '^NEXUS_IMAGE_ID=sha256:[0-9a-f]+$' <<<"${sanitized_output}" | tail -n 1 | cut -d= -f2 || true)"
          [[ -n "${image_id}" ]] || image_id="unavailable"
          echo "image_id=${image_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for healthy ALB target
        id: target
        env:
          INSTANCE_ID: ${{ steps.infrastructure.outputs.instance_id }}
          TARGET_GROUP_ARN: ${{ steps.infrastructure.outputs.target_group_arn }}
        run: |
          set -Eeuo pipefail
          aws elbv2 wait target-in-service \
            --target-group-arn "${TARGET_GROUP_ARN}" \
            --targets "Id=${INSTANCE_ID},Port=8081"
          target_health="$(aws elbv2 describe-target-health \
            --target-group-arn "${TARGET_GROUP_ARN}" \
            --targets "Id=${INSTANCE_ID},Port=8081" \
            --query 'TargetHealthDescriptions[0].TargetHealth.State' \
            --output text)"
          [[ "${target_health}" == "healthy" ]]
          echo "health=${target_health}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test Nexus through the ALB
        id: smoke
        env:
          ALB_DNS_NAME: ${{ steps.infrastructure.outputs.alb_dns_name }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            --max-time 10 "http://${ALB_DNS_NAME}/service/rest/v1/status" >/dev/null
          echo "result=passed" >> "${GITHUB_OUTPUT}"

      - name: Deployment summary
        if: success()
        env:
          NEXUS_VERSION: ${{ inputs.nexus_version }}
          IMAGE_ID: ${{ steps.deployment.outputs.image_id }}
          SSM_STATUS: ${{ steps.deployment.outputs.status }}
          TARGET_HEALTH: ${{ steps.target.outputs.health }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
        run: |
          {
            echo "### Nexus dev deployment"
            echo "- Requested version: ${NEXUS_VERSION}"
            echo "- Resolved image ID: ${IMAGE_ID}"
            echo "- SSM command: ${SSM_STATUS}"
            echo "- Target health: ${TARGET_HEALTH}"
            echo "- ALB smoke test: ${SMOKE_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify Slack
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: >-
              ${{ github.workflow }} | status: ${{ job.status }} | environment: dev |
              version: ${{ inputs.nexus_version }} | actor: ${{ github.actor }} |
              repository: ${{ github.repository }} | ref: ${{ github.ref_name }} |
              run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
